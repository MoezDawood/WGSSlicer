# Nginx configuration for WGS Slicer
# Place this file in /etc/nginx/sites-available/wgs-slicer
# Then create symlink: sudo ln -s /etc/nginx/sites-available/wgs-slicer /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.bcm.edu;  # Replace with your domain or IP
    
    # Optional: Add basic authentication
    # auth_basic "Restricted Access";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://localhost:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }

    # Optional: Add logging
    access_log /var/log/nginx/wgs-slicer-access.log;
    error_log /var/log/nginx/wgs-slicer-error.log;
}

